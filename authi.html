<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediVibe - Auth Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="authi.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-sidebar">
                <div class="brand-info">
                    <div class="logo-badge"><i class="ri-heart-pulse-fill"></i> MediVibe</div>
                    <h1>Healthcare Portal</h1>
                    <p>Secure portal access for Doctors, Patients, and System Management.</p>
                </div>
            </div>

            <div class="auth-body">
                
                <div class="role-pills">
                    <button class="role-pill active" data-role="DOCTOR">
                        <i class="ri-user-md-line"></i> Doctor
                    </button>
                    <button class="role-pill" data-role="PATIENT">
                        <i class="ri-user-3-line"></i> Patient
                    </button>
                    <button class="role-pill" data-role="ADMIN">
                        <i class="ri-shield-user-line"></i> Admin
                    </button>
                </div>

                <div class="auth-nav">
                    <button id="tab-login" class="nav-tab active">Sign In</button>
                    <button id="tab-signup" class="nav-tab">Register</button>
                </div>

                <div id="alert-box" class="alert hidden"></div>

                <form id="form-login" class="form-container">
                    <div class="input-field">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="login-email" required placeholder="Email Address">
                    </div>

                    <div class="input-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="login-password" required placeholder="Password">
                    </div>

                    <div class="form-actions-link">
                        <button type="button" id="forgot-password-btn" class="text-link">Forgot Password?</button>
                    </div>

                    <button type="submit" id="login-btn" class="btn-primary">
                        <span>Sign In</span>
                        <i class="ri-arrow-right-line"></i>
                    </button>
                </form>

                <form id="form-signup" class="form-container hidden">
                    <div class="input-field">
                        <i class="ri-user-line"></i>
                        <input type="text" id="signup-name" required placeholder="Full Name">
                    </div>

                    <div class="input-field">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="signup-email" required placeholder="Email Address">
                    </div>

                    <div class="input-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="signup-password" required placeholder="Password (Min 6 characters)">
                    </div>

                    <div class="input-field" id="license-wrapper">
                        <i class="ri-hospital-line"></i>
                        <input type="text" id="signup-license" placeholder="Medical License ID">
                    </div>

                    <button type="submit" id="signup-btn" class="btn-primary">
                        <span>Submit Registration</span>
                        <i class="ri-check-line"></i>
                    </button>
                </form>

                <div id="google-auth-wrapper" class="google-auth-container">
                    <div class="divider">
                        <span>OR</span>
                    </div>
                <button type="button" id="google-signin-btn" class="btn-google">
    <svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20" style="min-width: 20px;">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
    </svg>
    <span>Continue with Google</span>
</button>
                </div>

                <div id="recommendation-box" class="rec-box hidden">
                    <p id="rec-message"></p>
                    <div class="rec-actions">
                        <button type="button" id="rec-doc-btn" class="btn-sec">Register as Doctor</button>
                        <button type="button" id="rec-pat-btn" class="btn-sec">Register as Patient</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="reset-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <button id="close-reset-modal" class="modal-close"><i class="ri-close-line"></i></button>

            <div id="step-1-container">
                <div class="modal-header">
                    <div class="icon-circle"><i class="ri-key-2-line"></i></div>
                    <h2>Reset Password</h2>
                    <p>Enter your email to receive a 6-digit confirmation code.</p>
                </div>
                <form id="form-step-1">
                    <div class="input-field">
                        <i class="ri-mail-line"></i>
                        <input type="email" id="reset-email" required placeholder="Email Address">
                    </div>
                    <div id="step1-alert" class="alert hidden"></div>
                    <button type="submit" class="btn-primary" style="margin-top: 1rem;">
                        <span>Get Confirmation Code</span>
                        <i class="ri-arrow-right-line"></i>
                    </button>
                </form>
            </div>

            <div id="step-2-container" class="hidden">
                <div class="modal-header">
                    <div class="icon-circle"><i class="ri-shield-keyhole-line"></i></div>
                    <h2>Enter Code & New Password</h2>
                    <p>Check your email for the code and set your new password below.</p>
                </div>
                <form id="form-step-2">
                    <div class="input-field">
                        <i class="ri-hashtag"></i>
                        <input type="text" id="otp-code-input" maxlength="6" required placeholder="6-Digit Code (e.g. 482910)">
                    </div>

                    <div class="input-field">
                        <i class="ri-lock-line"></i>
                        <input type="password" id="new-password-input" minlength="6" required placeholder="New Password">
                    </div>

                    <div class="input-field">
                        <i class="ri-lock-check-line"></i>
                        <input type="password" id="confirm-password-input" minlength="6" required placeholder="Confirm New Password">
                    </div>

                    <div id="step2-alert" class="alert hidden"></div>

                    <button type="submit" class="btn-primary" style="margin-top: 1rem;">
                        <span>Update Password</span>
                        <i class="ri-check-double-line"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script type="module" src="./authi.js"></script>
</body>
</html>
