<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Medicate</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="errpage.css">

</head>
<body>

    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>

    <div class="center-stage">
        <!-- Absolute Floats Attached to Card Boundary -->
        <div class="floating-pill pill-top-left">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#135dd8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4.8 2.3A.3.3 0 0 0 4.5 2h-1a.5.5 0 0 0-.5.5v12a5 5 0 0 0 5 5h.5a3.5 3.5 0 0 0 3.5-3.5V12a3 3 0 0 0-3-3H6"/>
                <circle cx="18" cy="8" r="3"/>
            </svg>
            Emergency Support
        </div>

        <div class="floating-pill pill-bottom-right">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="10" cy="7" r="4"/>
                <path d="M14 11l2 2 4-4"/>
            </svg>
            200+ Active Specialists
        </div>

        <!-- Main Card -->
        <div class="error-card">
            <div class="error-code-wrapper">
                <h1 class="error-code">404</h1>
                <div class="medical-cross-badge">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#135dd8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
                        <line x1="12" y1="9" x2="12" y2="13"/>
                        <line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                </div>
            </div>

            <h2 class="error-title">Page Not Found</h2>
            <p class="error-desc">
                The medical record or page you are looking for doesn't exist or has been relocated to another department.
            </p>

            <div class="btn-group">
                <a href="/" class="btn-black">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Back to Homepage
                </a>
                <a href="#" class="btn-outline-glass">
                    Book Consultation 
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script src="./errpage.js"></script>
</body>
</html>
